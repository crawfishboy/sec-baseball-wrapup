<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SEC Baseball Wrap Up</title>

  <!-- ================= CSS ================= -->
  <style>
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 120px;
    }

    :root {
      --bg: #D7DEE9;
      --card: #F2F5FA;

      --primary: #2B5A9E;
      --accent: #3D7BC6;

      --text: #1A1F2B;
      --text-muted: #5B6475;

      --border: #D1D7E5;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ================= NAV ================= */
    .section-nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px;
      background: var(--primary);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .section-nav a {
      color: white;
      text-decoration: none;
      font-size: 13px;
    }

    /* ================= CONTAINER ================= */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px;
    }

    /* ================= TV SECTION ================= */
    .tv-day {
      font-weight: 700;
      color: var(--text-muted);
      margin: 14px 0 6px;
    }

    /* IMPORTANT: LINK WRAPPER */
    #tvData a.tv-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    /* ================= TV CARD ================= */
    .tv-card {
      display: grid;
      grid-template-columns: 120px 1fr 110px 90px;
      align-items: center;
      gap: 12px;

      padding: 10px 12px;
      margin-bottom: 6px;

      border-radius: 8px;
      background: #243355;
      border: 1px solid #2a3445;
      color: white;

      cursor: pointer;
    }

    .tv-card:hover {
      background: #2c4370;
      border-color: var(--accent);
    }

    /* ================= TIME ================= */
    .tv-time {
      width: 120px;
    }

    .time-main {
      font-size: 14px;
      font-weight: 700;
      color: white;
    }

    .time-sub {
      font-size: 10px;
      color: #cfe3ff;
    }

    /* ================= MATCHUP ================= */
    .tv-matchup {
      display: flex;
      flex-direction: column;
    }

    .teams {
      font-size: 14px;
      font-weight: 600;
    }

    /* ================= STATUS ================= */
    .badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 5px;
      font-weight: bold;
    }

    .badge.upcoming { background: #3D7BC6; color: white; }
    .badge.live { background: #dc2626; color: white; }
    .badge.final { background: #5B6475; color: white; }

    /* ================= NETWORK ================= */
    .tv-right {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .net-logo {
      height: 24px;
      max-width: 70px;
      object-fit: contain;
    }
  </style>
</head>

<body>

<!-- ================= NAV ================= -->
<div class="section-nav">
  <a href="#tv">TV Schedule</a>
  <a href="#games">Games</a>
  <a href="#standings">Standings</a>
</div>

<!-- ================= MAIN ================= -->
<div class="container">

  <h2 id="tv">TV Schedule</h2>
  <div id="tvData"></div>

  <h2 id="games">Games</h2>
  <div id="gamesData"></div>

  <h2 id="standings">Standings</h2>
  <div id="standingsData"></div>

</div>

<!-- ================= JS ================= -->
<script>
/* ================= SHEET ================= */
const BASE_ID = "2PACX-1vTJqWA6-51XcC3cm3u_x6lp-1HFr8MO8_qPenmFFbJ3ndqGhqVTUHEPGiJ7yM5lpRMLDXoc01tOqhpM";

const SHEETS = {
  current: "814890663"
};

/* ================= LOAD ================= */
document.addEventListener("DOMContentLoaded", () => {
  loadSchedule("current");
});

function getURL(week) {
  const gid = SHEETS[week] || SHEETS.current;
  return `https://docs.google.com/spreadsheets/d/e/${BASE_ID}/pub?gid=${gid}&single=true&output=csv`;
}

async function loadSchedule(week) {
  const res = await fetch(getURL(week) + "&t=" + Date.now());
  const text = await res.text();
  const rows = parseCSV(text);
  renderTV(rows);
}

/* ================= CSV ================= */
function parseCSV(csv) {
  return csv.trim().split("\n").map(r => r.split(","));
}

/* ================= STATUS ================= */
function getStatus() {
  return "upcoming";
}

/* ================= TIME ================= */
function formatTime(t) {
  return t || "";
}

/* ================= TV RENDER (LOCKED) ================= */
function renderTV(rows) {
  const el = document.getElementById("tvData");
  el.innerHTML = "";

  const grouped = {};

  rows.forEach(r => {
    const type = (r[0] || "").toLowerCase();
    if (type !== "tv") return;

    const date = r[1] || "No Date";
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(r);
  });

  Object.keys(grouped).forEach(date => {
    const day = document.createElement("div");
    day.className = "tv-day";
    day.textContent = date;
    el.appendChild(day);

    grouped[date].forEach(r => {
      const rawTime = r[2];
      const matchup = r[4];
      const network = r[5];
      const link = r[6];

      const a = document.createElement("a");
      a.className = "tv-link";
      a.href = (link && link.startsWith("http")) ? link : "#";
      a.target = "_blank";
      a.rel = "noopener noreferrer";

      const card = document.createElement("div");
      card.className = "tv-card";

      card.innerHTML = `
        <div class="tv-time">
          <div class="time-main">${formatTime(rawTime)} ET</div>
        </div>

        <div class="tv-matchup">
          <div class="teams">${matchup || ""}</div>
        </div>

        <div class="tv-status">
          <span class="badge upcoming">UPCOMING</span>
        </div>

        <div class="tv-right">
          ${network || ""}
        </div>
      `;

      a.appendChild(card);
      el.appendChild(a);
    });
  });
}
</script>

</body>
</html>
